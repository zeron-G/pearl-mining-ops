[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-mining-ops"
version = "0.1.0"
description = "Pearl mining operations toolkit with pool monitoring, wallet checks, and guarded SafeTrade automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.scripts]
pearl-ops = "pearl_ops.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pearl_ops = ["static/*"]
